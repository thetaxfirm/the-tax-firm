name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup errors out if it is
      # given one while package.json also declares `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Format check
        run: pnpm format --check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
      GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
      BLOG_API_KEY: ${{ secrets.BLOG_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup errors out if it is
      # given one while package.json also declares `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm/action-setup errors out if it is
      # given one while package.json also declares `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Assert the build produced what `pnpm start` serves
        run: |
          test -f dist/index.js
          test -f dist/public/index.html
          test -d dist/public/assets

  # Railway builds these images on deploy, so a broken Dockerfile only shows up
  # in production. Build both here instead.
  docker:
    name: Docker images (Railway)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the web image (railway.toml -> Dockerfile)
        run: docker build -f Dockerfile -t the-tax-firm-web .

      - name: Smoke-test the web image
        run: |
          docker run -d --name web -p 3000:3000 -e NODE_ENV=production the-tax-firm-web
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
          curl -sf -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:3000/
          curl -s -o /dev/null -w 'GET /api/oauth/callback -> %{http_code}\n' \
            http://127.0.0.1:3000/api/oauth/callback
          docker logs web
          docker rm -f web

      - name: Build the blog-sync worker image (railway.sync.toml -> Dockerfile.sync)
        run: docker build -f Dockerfile.sync -t the-tax-firm-sync .
